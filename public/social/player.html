<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Josh's corner — portfolio preview</title>
    <style>
      html {
        color-scheme: dark;
        background: #181615;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      video {
        display: block;
        width: 100%;
        height: auto;
        max-height: 100vh;
        aspect-ratio: 1200 / 630;
      }
      video:focus-visible {
        outline: 2px solid #d8c8aa;
        outline-offset: -2px;
      }
      a {
        color: #ebebec;
      }
    </style>
  </head>
  <body>
    <video
      controls
      loop
      playsinline
      muted
      preload="metadata"
      poster="./preview-v1.jpg"
      width="1200"
      height="630"
      aria-label="Josh's corner — animated portfolio preview"
    >
      <source src="./preview-v1.mp4" type="video/mp4" />
      <a href="./preview-v1.mp4">Watch the animated portfolio preview</a>
    </video>
  </body>
</html>
